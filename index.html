<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>进制转换在线考试</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 首页 -->
  <div class="page active" id="page-home">
    <div class="container" id="home-content"></div>
  </div>

  <!-- 答题页 -->
  <div class="page" id="page-exam">
    <div id="exam-content"></div>
  </div>

  <!-- 结果页 -->
  <div class="page" id="page-result">
    <div class="container" id="result-content"></div>
  </div>

  <!-- 历史记录页 -->
  <div class="page" id="page-history">
    <div class="container" id="history-content"></div>
  </div>

  <!-- 教师管理首页 -->
  <div class="page" id="page-admin">
    <div class="container" id="admin-content"></div>
  </div>

  <!-- 考试配置页 -->
  <div class="page" id="page-admin-config">
    <div class="container" id="admin-config-content"></div>
  </div>

  <!-- 成绩管理页 -->
  <div class="page" id="page-admin-scores">
    <div class="container" id="admin-scores-content"></div>
  </div>

  <!-- 数据管理页 -->
  <div class="page" id="page-admin-data">
    <div class="container" id="admin-data-content"></div>
  </div>

  <!-- 学生名单管理页 -->
  <div class="page" id="page-admin-students">
    <div class="container" id="admin-students-content"></div>
  </div>

  <!-- 考试监控页 -->
  <div class="page" id="page-admin-monitor">
    <div class="container" id="admin-monitor-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="js/converter.js?v=4"></script>
  <script src="js/storage.js?v=4"></script>
  <script src="js/anticheat.js?v=4"></script>
  <script src="js/cloud.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
